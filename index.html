<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEDINA</title>
<style>
:root{--bg:#f3f4f6;--bar:#e5e7eb;--panel:#fff;--text:#111827;--muted:#6b7280;--accent:#2563eb;--line:#d1d5db}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--bar:#1c1f27;--panel:#181b22;--text:#e5e7eb;--muted:#9ca3af;--accent:#60a5fa;--line:#2d313b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;flex-direction:column;height:100%}
#tabs{display:flex;gap:4px;padding:6px 6px 0;background:var(--bar);overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;min-width:120px;max-width:200px;padding:7px 10px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tab.active{background:var(--panel);color:var(--text)}
.tab span{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab b{font-weight:400;opacity:.6;padding:0 3px}.tab b:hover{opacity:1}
#plus{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 10px}
#toolbar{display:flex;gap:6px;align-items:center;padding:8px;background:var(--panel);border-bottom:1px solid var(--line)}
button.i{border:0;background:none;color:var(--text);font-size:18px;width:34px;height:34px;border-radius:50%;cursor:pointer}
button.i:hover{background:var(--bar)}button.i:disabled{opacity:.3;cursor:default}
#addr{flex:1;height:36px;border:1px solid var(--line);border-radius:18px;padding:0 16px;background:var(--bg);color:var(--text);font-size:15px;outline:none}
#addr:focus{border-color:var(--accent)}
#marks{display:flex;gap:6px;padding:4px 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;min-height:30px;align-items:center}
.mk{border:0;background:var(--bar);color:var(--text);border-radius:12px;padding:3px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
#view{flex:1;position:relative;overflow:auto;background:var(--panel)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#note{display:none;padding:6px 12px;font-size:13px;background:var(--bar);color:var(--muted);align-items:center;gap:10px}
#note a{color:var(--accent);cursor:pointer;text-decoration:underline}
.home{max-width:640px;margin:14vh auto 0;padding:0 20px;text-align:center}
.home h1{font-size:44px;margin:0 0 22px;font-weight:700;letter-spacing:.3em;padding-left:.3em}
.home input{width:100%;height:48px;border-radius:24px;border:1px solid var(--line);padding:0 22px;font-size:17px;background:var(--bg);color:var(--text);outline:none}
.home input:focus{border-color:var(--accent)}
.res{max-width:760px;margin:0 auto;padding:20px}
.res h2{font-size:14px;color:var(--muted);font-weight:500;margin:0 0 16px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px;line-height:1.5}
.r{margin-bottom:20px}.r a{font-size:19px;color:var(--accent);cursor:pointer}.r a:hover{text-decoration:underline}
.r small{display:block;color:var(--muted);font-size:12px;margin:2px 0;word-break:break-all}
.r div{line-height:1.45}
.fb{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:8px 14px;border-radius:14px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="tabs"></div>
  <div id="toolbar">
    <button class="i" id="back" title="Back">←</button>
    <button class="i" id="fwd" title="Forward">→</button>
    <button class="i" id="reload" title="Reload">⟳</button>
    <button class="i" id="home" title="Home">⌂</button>
    <input id="addr" placeholder="Search or enter a web address" autocomplete="off" spellcheck="false">
    <button class="i" id="star" title="Bookmark this page">☆</button>
  </div>
  <div id="marks"></div>
  <div id="note"><span>Some sites block being shown inside other pages.</span><a id="ext">Open this page in a real browser tab</a></div>
  <div id="view"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let tabs=[],cur=null,nid=1,marks=[];
try{const m=JSON.parse(localStorage.getItem('br_marks'));if(m)marks=m}catch(e){}
function saveMarks(){try{localStorage.setItem('br_marks',JSON.stringify(marks))}catch(e){}}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=s=>esc(String(s||'').replace(/<[^>]*>/g,''));

function newTab(){const t={id:nid++,hist:[{k:'home'}],i:0};tabs.push(t);cur=t;render()}
function entry(){return cur.hist[cur.i]}
function go(e){cur.hist=cur.hist.slice(0,cur.i+1);cur.hist.push(e);cur.i++;render()}
function title(e){return e.k==='home'?'New Tab':e.k==='search'?e.q:e.u.replace(/^https?:\/\/(www\.)?/,'')}
function safeUrl(u){return /^https?:\/\//i.test(u)?u:null}

function submit(text){
  text=text.trim();if(!text)return;
  if(/^https?:\/\//i.test(text)||/^[^\s]+\.[a-z]{2,}(\/.*)?$/i.test(text))
    return go({k:'page',u:/^https?:\/\//i.test(text)?text:'https://'+text});
  go({k:'search',q:text});
}

async function getJSON(url){const r=await fetch(url);if(!r.ok)throw 0;return r.json()}
async function runSearch(q){
  const [a,b]=await Promise.allSettled([
    getJSON('https://api.marginalia.nu/public/search/'+encodeURIComponent(q)+'?count=15'),
    getJSON('https://api.duckduckgo.com/?format=json&no_html=1&skip_disambig=1&q='+encodeURIComponent(q))
  ]);
  const results=[];
  if(a.status==='fulfilled'&&a.value&&Array.isArray(a.value.results))
    a.value.results.forEach(x=>{if(safeUrl(x.url))results.push({t:x.title||x.url,u:x.url,d:x.description})});
  let answer=null;
  if(b.status==='fulfilled'&&b.value){
    const d=b.value;
    if(d.AbstractText&&safeUrl(d.AbstractURL))answer={t:d.Heading,d:d.AbstractText,u:d.AbstractURL};
    const walk=l=>(l||[]).forEach(x=>{if(x.Topics)walk(x.Topics);else if(x.FirstURL&&safeUrl(x.FirstURL)&&results.length<25)results.push({t:(x.Text||'').split(' - ')[0].slice(0,90),u:x.FirstURL,d:x.Text})});
    walk(d.RelatedTopics);
  }
  return {results,answer};
}

async function render(){
  const tb=$('tabs');tb.innerHTML='';
  tabs.forEach(t=>{const d=document.createElement('div');d.className='tab'+(t===cur?' active':'');
    d.innerHTML='<span>'+esc(title(t.hist[t.i]))+'</span><b>×</b>';
    d.onclick=()=>{cur=t;render()};
    d.querySelector('b').onclick=ev=>{ev.stopPropagation();closeTab(t)};tb.appendChild(d)});
  const p=document.createElement('button');p.id='plus';p.textContent='+';p.onclick=()=>newTab();tb.appendChild(p);
  $('marks').innerHTML=marks.length?'':'<span style="color:var(--muted);font-size:13px">Click ☆ to bookmark a page</span>';
  marks.forEach((m,i)=>{const b=document.createElement('button');b.className='mk';b.textContent=m.t;b.title='Click to open · right-click to remove';
    b.onclick=()=>go({k:'page',u:m.u});b.oncontextmenu=ev=>{ev.preventDefault();marks.splice(i,1);saveMarks();render()};$('marks').appendChild(b)});
  const e=entry();
  $('back').disabled=cur.i===0;$('fwd').disabled=cur.i>=cur.hist.length-1;
  $('addr').value=e.k==='page'?e.u:e.k==='search'?e.q:'';
  $('star').textContent=e.k==='page'&&marks.some(m=>m.u===e.u)?'★':'☆';
  $('note').style.display=e.k==='page'?'flex':'none';
  const v=$('view');
  if(e.k==='home'){
    v.innerHTML='<div class="home"><h1>MEDINA</h1><input id="hq" placeholder="Search the web or type an address" autofocus></div>';
    $('hq').onkeydown=ev=>{if(ev.key==='Enter')submit(ev.target.value)};
  }else if(e.k==='page'){
    v.innerHTML='';const f=document.createElement('iframe');f.src=e.u;f.referrerPolicy='no-referrer';v.appendChild(f);
  }else{
    const q=e.q,t=cur;
    v.innerHTML='<div class="res"><h2>Searching for “'+esc(q)+'”…</h2></div>';
    const {results,answer}=await runSearch(q);
    if(cur!==t||entry()!==e)return;
    let h='<div class="res">';
    if(answer)h+='<div class="card"><b>'+esc(answer.t)+'</b><br>'+esc(answer.d)+'<br><small><a style="color:var(--accent);cursor:pointer" data-u="'+esc(answer.u)+'">Read more</a></small></div>';
    if(results.length){
      h+='<h2>'+results.length+' results for “'+esc(q)+'”</h2>';
      results.forEach(x=>h+='<div class="r"><a data-u="'+esc(x.u)+'">'+clean(x.t)+'</a><small>'+esc(x.u)+'</small><div>'+clean(x.d)+'</div></div>');
    }else if(!answer){
      h+='<h2>No results could be loaded for “'+esc(q)+'”. You may be offline, or the free search sources may be unavailable.</h2><button class="fb" id="fb">Search the full web in a new tab</button>';
    }
    h+='</div>';v.innerHTML=h;
    v.querySelectorAll('[data-u]').forEach(a=>a.onclick=()=>go({k:'page',u:a.dataset.u}));
    const fb=$('fb');if(fb)fb.onclick=()=>window.open('https://duckduckgo.com/?q='+encodeURIComponent(q),'_blank','noopener');
  }
}
function closeTab(t){const i=tabs.indexOf(t);tabs.splice(i,1);if(!tabs.length)return newTab();if(cur===t)cur=tabs[Math.max(0,i-1)];render()}

$('addr').onkeydown=e=>{if(e.key==='Enter')submit(e.target.value)};
$('addr').onfocus=e=>e.target.select();
$('back').onclick=()=>{if(cur.i>0){cur.i--;render()}};
$('fwd').onclick=()=>{if(cur.i<cur.hist.length-1){cur.i++;render()}};
$('reload').onclick=()=>render();
$('home').onclick=()=>go({k:'home'});
$('ext').onclick=()=>{const e=entry();if(e.k==='page')window.open(e.u,'_blank','noopener')};
$('star').onclick=()=>{const e=entry();if(e.k!=='page')return;const i=marks.findIndex(m=>m.u===e.u);
  if(i>=0)marks.splice(i,1);else marks.push({t:title(e).slice(0,24),u:e.u});saveMarks();render()};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='t'){e.preventDefault();newTab()}
  if((e.ctrlKey||e.metaKey)&&e.key==='l'){e.preventDefault();$('addr').focus()}});
newTab();
</script>
</body>
</html>
